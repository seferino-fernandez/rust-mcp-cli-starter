allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
# Words `doc_markdown` accepts without backticks. ".." keeps clippy's defaults.
doc-valid-idents = [
    "..",
    "API",
    "APIs",
    "CLI",
    "CSRF",
    "HTTP",
    "HTTPS",
    "JSON",
    "LLM",
    "MCP",
    # Generation renames this to the project's SCREAMING_SNAKE name, which
    # doc_markdown would otherwise flag in prose such as "the MYAPP API".
    "MYAPP",
    "MyApp",
    "OAuth",
    "PKCE",
    "TOML",
    "URL",
    "URLs",
    "UUID",
]
