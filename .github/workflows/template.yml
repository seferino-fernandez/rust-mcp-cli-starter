name: Template Generation

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        # Weekly, to catch dependency and toolchain drift.
        - cron: "0 6 * * 1"
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    RUSTFLAGS: -D warnings
    CARGO_PROFILE_TEST_DEBUG: 0
    PROJECT_NAME: acme-tools

jobs:
    generate:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                transport: [stdio, http, http-oauth]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  lfs: true

            # Installs the pinned toolchain (with clippy and rustfmt) from
            # rust-toolchain.toml. rustfmt must be present before generation:
            # the pre hook runs `cargo fmt`.
            - name: Install Rust toolchain
              run: rustup toolchain install

            # Same tools and pins as the generated project's
            # pull-request-validation.yml. cargo-generate is installed via the
            # cargo-binstall fallback; install-action passes github.token to it.
            - name: Install cargo-generate, nextest, cargo-shear and typos
              uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
              with:
                  tool: cargo-generate@0.26.0,cargo-nextest@0.9.152,cargo-shear@1.14.1,typos@1.52.2

            - name: Install tombi
              uses: tombi-toml/setup-tombi@7417bd6e820cf0d4f89d77b48d13ba5d060435bf # v1.11.3

            - name: Install ast-grep
              run: npm install --global @ast-grep/cli@0.51.3

            # The generated project runs cargo-deny through
            # EmbarkStudios/cargo-deny-action, a container action that cannot
            # see $RUNNER_TEMP, so install the same release binary it uses.
            - name: Install cargo-deny
              run: |
                  curl --proto '=https' --tlsv1.2 -sSfL \
                      https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/cargo-deny-0.21.0-x86_64-unknown-linux-musl.tar.gz \
                      | tar -xz -C "$HOME/.cargo/bin" --strip-components=1 --wildcards '*/cargo-deny'

            # Generate outside the checkout, otherwise cargo-generate adds the
            # output to the template's own workspace.
            - name: Generate project from template
              run: |
                  # Exercise the actual default by omitting the choice for stdio.
                  transport_args=()
                  if [ "${{ matrix.transport }}" != stdio ]; then
                      transport_args=(--define "mcp_transport=${{ matrix.transport }}")
                  fi
                  cargo generate \
                      --path "$GITHUB_WORKSPACE" \
                      --name "$PROJECT_NAME" \
                      --allow-commands \
                      --silent \
                      --define github_org=acme-corp \
                      --define 'authors=Template CI <ci@example.com>' \
                      "${transport_args[@]}" \
                      --destination "$RUNNER_TEMP"
                  echo "PROJECT_DIR=$RUNNER_TEMP/$PROJECT_NAME" >> "$GITHUB_ENV"

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  workspaces: ${{ env.PROJECT_DIR }}
                  key: template-${{ matrix.transport }}

            - name: Check selected capabilities
              run: bash scripts/check-generated.sh "$PROJECT_DIR" "${{ matrix.transport }}"

            # Case-sensitive on purpose: tests legitimately contain "MyApp".
            - name: Check for leftover template identifiers
              working-directory: ${{ env.PROJECT_DIR }}
              run: |
                  if hits=$(grep -rnI -e myapp -e MYAPP -e Seferino -e your-org -e your-project . \
                      --exclude-dir=target --exclude-dir=.git); then
                      echo "::error::Generated project contains leftover template identifiers:"
                      echo "$hits"
                      exit 1
                  fi

            - name: Check template machinery is not shipped
              working-directory: ${{ env.PROJECT_DIR }}
              run: |
                  status=0
                  for f in pre-script.rhai cargo-generate.toml README.generated.md AGENTS.generated.md .github/workflows/template.yml; do
                      if [ -e "$f" ]; then
                          echo "::error::Template file '$f' should not exist in the generated project"
                          status=1
                      fi
                  done
                  if [ ! -f Cargo.lock ]; then
                      echo "::error::Generated project is missing Cargo.lock"
                      status=1
                  fi
                  if ! grep -qF "Copyright (c) $(date -u +%Y) Template CI" LICENSE.md; then
                      echo "::error::LICENSE.md does not name the generating author and current year"
                      status=1
                  fi
                  exit "$status"

            - name: Check justfile recipe arguments survived Liquid rendering
              working-directory: ${{ env.PROJECT_DIR }}
              run: |
                  status=0
                  for pattern in 'completions {{shell}}' 'man {{dir}}'; do
                      if ! grep -qF "$pattern" justfile; then
                          echo "::error::justfile is missing '$pattern'"
                          status=1
                      fi
                  done
                  exit "$status"

            - name: Run cargo fmt
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo fmt --all --check

            # Runs before clippy/tests so the lockfile is verified before any
            # cargo command could rewrite it.
            - name: Compile
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo check --locked

            - name: Run cargo clippy
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

            - name: Run tests (all features)
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo nextest run --locked --workspace --all-targets --all-features

            - name: Run tests (default features)
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo nextest run --locked --workspace

            - name: Run doc tests
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo test --locked --workspace --doc

            - name: Check generated CLI surface
              run: bash scripts/check-generated.sh "$PROJECT_DIR" "${{ matrix.transport }}" cli

            - name: Build docs
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo doc --locked --workspace --no-deps --all-features
              env:
                  RUSTDOCFLAGS: -D warnings

            - name: Run cargo deny
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo deny --all-features check

            - name: Run cargo shear
              working-directory: ${{ env.PROJECT_DIR }}
              run: cargo shear

            - name: Run typos
              working-directory: ${{ env.PROJECT_DIR }}
              run: typos

            - name: Check TOML formatting
              working-directory: ${{ env.PROJECT_DIR }}
              run: tombi format --check

            - name: Lint TOML
              working-directory: ${{ env.PROJECT_DIR }}
              run: tombi lint --error-on-warnings

            - name: Run ast-grep rules
              working-directory: ${{ env.PROJECT_DIR }}
              run: ast-grep scan --format github

            - name: Test ast-grep rules
              working-directory: ${{ env.PROJECT_DIR }}
              run: ast-grep test
