minimum_prek_version: "0.5.9"
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        always_run: true
      - id: typos
        name: typos
        entry: typos
        language: system
        pass_filenames: false
        always_run: true
      - id: tombi-format
        name: tombi-format
        entry: tombi format --check
        language: system
        pass_filenames: false
        always_run: true
      - id: tombi-lint
        name: tombi-lint
        entry: tombi lint --error-on-warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: ast-grep
        name: ast-grep
        entry: ast-grep scan
        language: system
        pass_filenames: false
        always_run: true
