[workspace]
resolver = "2"
members = [
  "crates/myapp-core",
  "crates/myapp-cli",
  "crates/myapp-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/your-org/your-project"
rust-version = "1.100"

[workspace.dependencies]
myapp-core = { version = "0.1.0", path = "crates/myapp-core" }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "query", "gzip", "deflate", "brotli"] }
thiserror = "2.0.21"
dirs = "7.0.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
toml = "1.2.1"
schemars = { version = "1.2.3", features = ["uuid1"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.3"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
comfy-table = "8.0.1"
rmcp = "3.10.0"
# template:begin http
axum = "0.8.9"
tokio-util = "0.7.20"
subtle = "2.6.1"
sha2 = "0.11.1"
# template:end http
base64 = "0.23.1"
# template:begin oauth
serde_urlencoded = "0.7.1"
urlencoding = "2.1.3"
tower-http = "0.7.1"
# template:end oauth
wiremock = "0.6.5"
tempfile = "3.27.0"
# template:begin http
tower = "0.5.3"
# template:end http
url = "2.5.8"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Public accessors and builders do not need a must_use annotation on every return value.
must_use_candidate = "allow"
# Domain names such as config/configs and request/response remain readable together.
similar_names = "allow"

# Keep functions small, matches exhaustive, and output deliberate
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
exit = "warn"
infinite_loop = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_clone = "warn"
shadow_unrelated = "warn"
wildcard_enum_match_arm = "warn"

# Prevent panics from unwraps and unsafe slicing or indexing
arithmetic_side_effects = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

# Prevent dropped futures and swallowed errors
assertions_on_result_states = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"

# Prevent unsafe things with memory
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# Prevent potentially incorrect things with numbers
float_cmp_const = "warn"
lossy_float_literal = "warn"

# Don't Do Bad Things That are Easy to Avoid
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
infallible_try_from = "warn"
rc_mutex = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
opt-level = 3  # Optimize for speed.
strip = true  # Automatically strip symbols from the binary.
lto = true  # Enable Link Time Optimization (LTO)
codegen-units = 1  # Reduce Parallel Code Generation Units to Increase Optimization

# Release build that keeps debug info for profilers such as samply or perf.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Build profile for `cargo mutants` (see .cargo/mutants.toml).
[profile.mutants]
inherits = "test"
debug = "none"
