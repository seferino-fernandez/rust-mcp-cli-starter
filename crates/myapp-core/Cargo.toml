[package]
name = "myapp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Async Rust client library for the MYAPP API"
readme = "README.md"
keywords = ["api", "client", "async", "http", "rest"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[features]
# Derive `schemars::JsonSchema` on the public API models so MCP/rmcp consumers
# can advertise tool output schemas. Off by default to keep the core client free
# of the schemars dependency.
schema = ["dep:schemars"]
# Shared `completions` and `man` subcommand implementations for the binaries
# (the `cli` module). Off by default so library users don't pull in clap.
cli = ["dep:clap", "dep:clap_complete", "dep:clap_complete_nushell", "dep:clap_mangen"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
dirs.workspace = true
tracing.workspace = true
toml.workspace = true
url.workspace = true
schemars = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
clap_complete_nushell = { workspace = true, optional = true }
clap_mangen = { workspace = true, optional = true }

[dev-dependencies]
wiremock.workspace = true
tokio = {
  workspace = true,
  features = [
    "test-util",
    "macros",
    "rt-multi-thread",
  ]
}
tempfile.workspace = true

[lints]
workspace = true
