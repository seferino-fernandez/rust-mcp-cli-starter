[package]
name = "myapp-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server exposing the MYAPP API to LLM clients"
readme = "README.md"
keywords = ["mcp", "mcp-server", "llm", "ai", "api"]
categories = ["api-bindings", "web-programming::http-server", "development-tools"]

[[bin]]
name = "myapp-mcp"
path = "src/main.rs"

[dependencies]
myapp-core = { workspace = true, features = ["schema"] }
tokio.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
clap_mangen = { workspace = true }
clap-verbosity-flag = { workspace = true }
rmcp = { workspace = true, features = [
    "server",
    "transport-io",
    # template:begin http
    "transport-streamable-http-server",
    # template:end http
    "macros",
    "schemars",
    "request-state",
] }
schemars.workspace = true
uuid.workspace = true
# template:begin http
axum = { workspace = true, features = ["http1", "tokio"] }
tokio-util.workspace = true
subtle.workspace = true
sha2.workspace = true
# template:end http
# template:begin oauth
base64.workspace = true
serde_urlencoded.workspace = true
url.workspace = true
tower-http = { workspace = true, features = ["cors"] }
# template:end oauth

[dev-dependencies]
base64.workspace = true
# template:begin http
tower.workspace = true
# template:end http
# template:begin oauth
urlencoding.workspace = true
# template:end oauth
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
