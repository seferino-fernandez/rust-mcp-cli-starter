# Tombi: TOML formatter and linter (`tombi format`, `tombi lint`).
# Docs: https://tombi-toml.github.io/tombi/

# Keep Cargo.toml keys and arrays in their written order: entries are grouped
# by purpose, and comments sit next to the entries they describe.
[[schemas]]
path = "tombi://www.schemastore.org/cargo.json"
include = ["**/Cargo.toml"]
format.rules.array-values-order.enabled = false
format.rules.table-keys-order.enabled = false
